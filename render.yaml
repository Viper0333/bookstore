databases:
  - name: bookstore-db
    plan: free
    databaseName: bookstore
    user: bookstoreuser

services:
  - type: web
    name: bookstore-api
    env: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "./entrypoint.sh"
    envVars:
      - key: SECRET_KEY
        value: changeme
      - key: DEBUG
        value: False
      - key: DATABASE_URL
        fromDatabase:
          name: bookstore-db
          property: connectionString
