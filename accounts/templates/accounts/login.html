{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body { font-family: system-ui, Arial, sans-serif; margin: 0; padding: 2rem; display: grid; place-items: center; }
        .card { width: 100%; max-width: 420px; padding: 1.5rem; border: 1px solid #ddd; border-radius: 16px; box-shadow: 0 2px 16px rgba(0,0,0,0.05); }
        label { display:block; margin-top: .75rem; }
        input { width: 100%; padding: .65rem; border: 1px solid #ccc; border-radius: 10px; }
        button { width: 100%; padding: .8rem; margin-top: 1rem; border-radius: 12px; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Entrar</h2>
        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            <label>Usuário</label>
            <input name="username" required />
            <label>Senha</label>
            <input name="password" type="password" required />
            <button type="submit">Login</button>
        </form>
        <p>Não tem conta? <a href="{% url 'register' %}">Cadastre-se</a></p>
    </div>
</body>
</html>
