<h1>Perfil de {{ user_profile.username }}</h1>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ u_form.as_p }}
    {{ p_form.as_p }}
    <button type="submit">Atualizar Perfil</button>
</form>

<p>
    <a href="{% url 'logout' %}">Sair</a>
</p>
